server {
    listen 80;
    server_name pearlwallet.az1993.xyz;
    location /.well-known/acme-challenge/ { root /var/www/pearlwallet; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name pearlwallet.az1993.xyz;
    ssl_certificate /etc/letsencrypt/live/pearlwallet.az1993.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pearlwallet.az1993.xyz/privkey.pem;

    location = /api/update {
        alias /var/www/pearlwallet/api/update.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /releases/ {
        alias /var/www/pearlwallet/releases/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    location / { return 404; }
}
