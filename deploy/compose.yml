services:
  pearlwallet-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    ports:
      - "127.0.0.1:8788:8787"
    environment:
      PEARL_CREDENTIAL_KEY_FILE: /run/secrets/credential-key
    volumes:
      - ../server/data:/data
      - ../private/credential-key:/run/secrets/credential-key:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
